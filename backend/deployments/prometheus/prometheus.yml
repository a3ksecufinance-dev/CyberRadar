global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: cyber-radar
    environment: dev

# Alertmanager (add when deploying to staging/prod)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# Alert rules
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # ─── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ─── CRP Microservices ────────────────────────────────────────────────────
  - job_name: crp-tenant-service
    metrics_path: /metrics
    static_configs:
      - targets: ["tenant-service:8001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: tenant-service

  - job_name: crp-identity-service
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:8002"]
    relabel_configs:
      - target_label: service
        replacement: identity-service

  - job_name: crp-audit-service
    metrics_path: /metrics
    static_configs:
      - targets: ["audit-service:8003"]
    relabel_configs:
      - target_label: service
        replacement: audit-service

  - job_name: crp-notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8004"]

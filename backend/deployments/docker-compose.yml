  # ─── Syslog Connector ────────────────────────────────────
  syslog-connector:
    build:
      context: ..
      dockerfile: services/syslog/Dockerfile
    container_name: crp-syslog-connector
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=crp.events.normalized
      - DEFAULT_TENANT_ID=default
      - SYSLOG_UDP_ADDR=:5140
      - SYSLOG_TCP_ADDR=:5141
      - SYSLOG_TLS_ADDR=:6514
      - TLS_CERT_FILE=/certs/syslog.crt
      - TLS_KEY_FILE=/certs/syslog.key
      - HEALTH_PORT=8031
      - LOG_LEVEL=info
    ports:
      - "5140:5140/udp"   # UDP syslog (RFC 5426) — maps to standard port 514
      - "5141:5141/tcp"   # TCP syslog (RFC 6587) — maps to standard port 514
      - "6514:6514/tcp"   # TLS syslog (RFC 5425)
      - "8031:8031"       # HTTP health / metrics
    volumes:
      - ./certs:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8031/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crp-network

  # ─── Domain 2: Asset Intelligence ────────────────────────
  asset-service:
    build:
      context: ..
      dockerfile: services/asset/Dockerfile
    container_name: crp-asset-service
    restart: unless-stopped
    environment:
      - SERVICE_NAME=asset-service
      - CORS_ALLOWED_ORIGINS=${CRP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CRP_TRUSTED_PROXY_CIDRS=${CRP_TRUSTED_PROXY_CIDRS:-}
      - SERVICE_PORT=8006
      - DATABASE_URL=postgres://crp_user:crp_password_dev@postgres:5432/crp_foundation?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - JWT_PUBLIC_KEY_PATH=/etc/crp/jwt/public.pem
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - LOG_LEVEL=debug
    volumes: *jwt-public-key
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - crp-network

  # ─── Domain 10: SOAR ─────────────────────────────────────
  soar-service:
    build:
      context: ..
      dockerfile: services/soar/Dockerfile
    container_name: crp-soar-service
    restart: unless-stopped
    environment:
      - SERVICE_NAME=soar-service
      - CORS_ALLOWED_ORIGINS=${CRP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CRP_TRUSTED_PROXY_CIDRS=${CRP_TRUSTED_PROXY_CIDRS:-}
      - SERVICE_PORT=8014
      - DATABASE_URL=postgres://crp_user:crp_password_dev@postgres:5432/crp_foundation?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - JWT_PUBLIC_KEY_PATH=/etc/crp/jwt/public.pem
      # The SOAR acts with no user behind it, on alerts belonging to any
      # tenant, so it authenticates with a platform-scoped service account and
      # takes a token per tenant. Create it once with the soar_executor role
      # (see README) and put the secret in Vault for anything but dev.
      - IDENTITY_URL=http://identity-service:8002
      # The account has to exist before the SOAR can act: without it every
      # action that reaches another service answers 401. Create it once with
      #   go run ./internal/cmd/svcaccount -client-id soar-executor \
      #     -role soar_executor -out /secure/path/soar-executor.json
      # and pass the secret here. See docs/14-soar-ir.md.
      - SOAR_CLIENT_ID=${CRP_SOAR_CLIENT_ID:-soar-executor}
      - SOAR_CLIENT_SECRET=${CRP_SOAR_CLIENT_SECRET:?create the soar-executor service account first — see docs/14-soar-ir.md}
      - AUDIT_URL=http://audit-service:8003
      # Services the playbook actions reach. A service left out disables the
      # actions that need it, and they then fail saying so — rather than
      # reporting a containment that never happened.
      - NETSEC_URL=http://netsec-service:8022
      - ASSET_URL=http://asset-service:8006
      - TI_URL=http://ti-service:8010
      - VULN_URL=http://vuln-service:8011
      - NOTIFICATION_URL=http://notification-service:8004
      - SIEM_URL=http://siem-service:8008
      - IR_URL=http://ir-service:8026
      - ATTACKPATH_URL=http://attackpath-service:8012
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - LOG_LEVEL=debug
    volumes: *jwt-public-key
    ports:
      - "8014:8014"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - crp-network


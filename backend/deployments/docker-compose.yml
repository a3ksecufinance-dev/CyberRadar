      - KAFKA_BROKERS=kafka:9092
      - JWT_PUBLIC_KEY_PATH=/etc/crp/jwt/public.pem
      # Setting NEO4J_URI turns on the mirror: every entity and relationship
      # goes to PostgreSQL and then to Neo4j. Traversals only move once
      # `make kg-reconcile` reports parity — until then this stays on postgres.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=crp_password_dev
      - KG_GRAPH_READS=postgres
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

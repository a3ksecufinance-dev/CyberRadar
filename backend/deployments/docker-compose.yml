  # ─── Syslog Connector ────────────────────────────────────
  syslog-connector:
    build:
      context: ..
      dockerfile: services/syslog/Dockerfile
    container_name: crp-syslog-connector
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=crp.events.normalized
      - DEFAULT_TENANT_ID=default
      - SYSLOG_UDP_ADDR=:5140
      - SYSLOG_TCP_ADDR=:5141
      - SYSLOG_TLS_ADDR=:6514
      - TLS_CERT_FILE=/certs/syslog.crt
      - TLS_KEY_FILE=/certs/syslog.key
      - HEALTH_PORT=8031
      - LOG_LEVEL=info
    ports:
      - "5140:5140/udp"   # UDP syslog (RFC 5426) — maps to standard port 514
      - "5141:5141/tcp"   # TCP syslog (RFC 6587) — maps to standard port 514
      - "6514:6514/tcp"   # TLS syslog (RFC 5425)
      - "8031:8031"       # HTTP health / metrics
    volumes:
      - ./certs:/certs:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8031/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crp-network

